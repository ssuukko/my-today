spring.application.name=my-today
spring.profiles.default=local
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mytoday}
spring.datasource.username=${DB_USERNAME:mytoday}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true
server.servlet.session.cookie.name=MT_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.timeout=7d
server.error.include-message=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
registration.invite-token=${REGISTRATION_INVITE_TOKEN:}
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
logging.pattern.level=%5p [requestId:%X{requestId}]
